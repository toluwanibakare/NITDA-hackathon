[project]
name = "thirdeye-sdk"
version = "0.1.0"
description = "ThirdEye SDK — guard third-party integrations with continuous trust scoring"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "TMB", email = "mosesbakare48@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/toluwanibakare/thirdeye"
Repository = "https://github.com/toluwanibakare/thirdeye"
Issues = "https://github.com/toluwanibakare/thirdeye/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["thirdeye*"]
